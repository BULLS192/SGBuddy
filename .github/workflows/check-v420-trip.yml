name: SGBuddy V4.20 Trip Planning Quality
on:
  pull_request:
    paths:
      - 'app-trip-quality-v420.js'
      - 'trip-quality-v420.css'
      - 'lib/trip-insights-v420.mjs'
      - 'scripts/check-v420-trip-quality.mjs'
      - 'scripts/check-v420-trip-integration.mjs'
      - 'scripts/browser-qa-v420-trip.mjs'
      - 'app-v090.js'
      - 'index.html'
      - '.github/workflows/check-v420-trip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check app-trip-quality-v420.js
          node --check lib/trip-insights-v420.mjs
          node scripts/check-v420-trip-quality.mjs
          node scripts/check-v420-trip-integration.mjs
          node scripts/check-v419-release.mjs
          node scripts/check-v419-trip-wave2.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sgbuddy-v420.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/sgbuddy-v420.log; exit 1
      - run: |
          node scripts/browser-qa-v420-trip.mjs
          node scripts/browser-qa-v419-trip.mjs
