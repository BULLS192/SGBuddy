name: SGBuddy UX 1-3 checks
on:
  push:
    branches:
      - feature/sgbuddy-ux-waves-1-3
  pull_request:
    paths:
      - 'app-ux-v160.js'
      - 'ux-v160.css'
      - 'index.html'
      - 'app-v090.js'
      - 'sw.js'
      - 'scripts/check-ux.mjs'
      - 'scripts/check-all.mjs'
      - '.github/workflows/check-ux.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all SGBuddy regression checks
        run: npm run check
