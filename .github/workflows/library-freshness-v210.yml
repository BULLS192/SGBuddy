name: SGBuddy Weekly Library Freshness
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  push:
    branches: [feature/sgbuddy-v2.1-services-food-freshness]
    paths:
      - 'scripts/library-freshness-v210.mjs'
      - '.github/workflows/library-freshness-v210.yml'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Try fresh official data pull (report only, do not commit or deploy)
        run: node scripts/build-official-library.mjs || echo "Official-location refresh failed; inspect report."
      - name: Try healthcare and essential services pull (report only)
        run: node scripts/build-services-v210.mjs || echo "Service-location refresh failed; inspect report."
      - name: Try historical supermarket table (non-critical)
        run: node scripts/build-supermarkets-v210.mjs || echo "Legacy supermarket dataset unavailable; keep unknown, do not fabricate."
      - name: Generate source coverage, staleness and record-diff reports
        run: node scripts/library-freshness-v210.mjs
      - name: Generate V2.2 evidence quality and manual verification queue
        run: node scripts/library-quality-v220.mjs
      - name: Generate V2.3 operator, menu and neighbourhood evidence queue
        run: node scripts/library-evidence-v230.mjs
      - name: Generate V2.4 app and digital-service editorial review queue
        run: node scripts/apps-quality-v240.mjs
      - name: Upload report and source snapshots for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: sgbuddy-source-freshness
          path: |
            reports/library-freshness-v210.json
            reports/library-freshness-v210.md
            reports/library-quality-v220.json
            reports/library-quality-v220.md
            reports/library-verification-queue-v220.csv
            reports/library-evidence-v230.json
            reports/library-evidence-v230.md
            reports/library-review-queue-v230.csv
            reports/apps-quality-v240.json
            reports/apps-quality-v240.md
            reports/apps-review-v240.csv
            data/services-v210.json
            data/official-places-v200.json
          retention-days: 30
