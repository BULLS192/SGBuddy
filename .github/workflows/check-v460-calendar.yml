name: SGBuddy V4.6 Calendar QA
on:
  pull_request:
    paths:
      - 'data/holidays-2026-2027-v460.json'
      - 'data/event-sources-v470.json'
      - 'lib/calendar-*'
      - 'app-calendar-v460.js'
      - 'calendar-v460.css'
      - 'scripts/*v460.mjs'
      - 'index.html'
      - 'app-v090.js'
      - 'sw.js'
      - '.github/workflows/check-v460-calendar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calendar-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate holidays, source registry and 12-language labels
        run: node scripts/check-v460.mjs
  calendar-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium test dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve static development app
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sgbuddy-v460.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/sgbuddy-v460.log
          exit 1
      - name: Mobile and desktop holiday + language QA
        run: node scripts/browser-qa-v460.mjs
