name: SGBuddy V3.2–V3.3 Multilingual Runtime Coverage
on:
  push:
    branches: [feature/sgbuddy-v3.2-runtime-l10n]
  pull_request:
    paths:
      - 'lib/i18n-runtime-v320.mjs'
      - 'lib/i18n-place-eta-v320.mjs'
      - 'app-v090.js'
      - 'app-v110.js'
      - 'sw.js'
      - 'scripts/check-v320.mjs'
      - 'scripts/browser-qa-v320.mjs'
      - '.github/workflows/check-v320-browser.yml'
      - 'lib/i18n-system-v330.mjs'
      - 'app-i18n-system-v330.js'
      - 'scripts/check-v330.mjs'
      - 'scripts/browser-qa-v330.mjs'
      - 'scripts/localization-inventory-v330.mjs'
      - 'lib/i18n-dynamic-v340.mjs'
      - 'app-i18n-dynamic-v340.js'
      - 'scripts/check-v340.mjs'
      - 'scripts/browser-qa-v340.mjs'
      - 'scripts/localization-inventory-v340.mjs'
      - 'lib/i18n-audit-v350.mjs'
      - 'app-i18n-audit-v350.js'
      - 'scripts/check-v350.mjs'
      - 'scripts/coverage-audit-v350.mjs'
      - 'scripts/browser-qa-v350.mjs'
      - 'lib/i18n-classified-v360.mjs'
      - 'app-i18n-classified-v360.js'
      - 'scripts/check-v360.mjs'
      - 'scripts/localization-review-v360.mjs'
      - 'scripts/browser-qa-v360.mjs'
      - 'lib/i18n-context-v370.mjs'
      - 'app-i18n-context-v370.js'
      - 'scripts/check-v370.mjs'
      - 'scripts/browser-qa-v370.mjs'
      - 'lib/i18n-fallback-v390.mjs'
      - 'app-i18n-fallback-v390.js'
      - 'scripts/browser-qa-v390.mjs'
      - 'scripts/check-v390.mjs'
      - 'scripts/classify-localization-v390.mjs'
      - 'scripts/inspect-js-localization-v370.mjs'
      - 'scripts/export-native-review-v370.mjs'
permissions:
  contents: read
jobs:
  runtime-language:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full static regression suite
        run: node scripts/check-all.mjs
      - name: Install mobile Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sgbuddy-v320.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/sgbuddy-v320.log
          exit 1
      - name: Twelve-language account, weather and ETA browser QA
        run: node scripts/browser-qa-v320.mjs
      - name: Twelve-language account and comparison UX QA
        run: node scripts/browser-qa-v330.mjs
      - name: V3.4 Dynamic translation mobile and desktop QA
        run: node scripts/browser-qa-v340.mjs
      - name: V3.5 Screen-by-screen 12-language Chromium QA
        run: node scripts/browser-qa-v350.mjs
      - name: V3.6 Classifications and safe dynamic translation Chromium QA
        run: node scripts/browser-qa-v360.mjs
      - name: V3.7 twelve-language context and source-protection Chromium QA
        run: node scripts/browser-qa-v370.mjs
      - name: V3.9 twelve-language fallback and source-protection Chromium QA
        run: node scripts/browser-qa-v390.mjs
