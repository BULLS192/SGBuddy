name: SGBuddy V4.18 Events Discovery and Editorial QA
on:
  pull_request:
    paths:
      - 'lib/events-discovery-v418.mjs'
      - 'lib/events-discovery-i18n-v418.mjs'
      - 'lib/events-source-health-v418.mjs'
      - 'scripts/check-v418-discovery.mjs'
      - 'scripts/browser-qa-v418-events.mjs'
      - 'scripts/event-source-health-v418.mjs'
      - 'app-events-v470.js'
      - 'events-v470.css'
      - 'sw.js'
      - 'index.html'
      - 'app-v090.js'
      - 'scripts/check-all.mjs'
      - '.github/workflows/check-v418-events.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  events-discovery-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/check-v418-discovery.mjs
          node scripts/event-source-health-v418.mjs --check
          node scripts/check-event-review-v413.mjs
          node scripts/check-events-v414-wave4.mjs
  events-discovery-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sgbuddy-v418.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/sgbuddy-v418.log; exit 1
      - run: node scripts/browser-qa-v418-events.mjs
