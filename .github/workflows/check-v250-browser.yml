name: SGBuddy V2.5 Chromium interaction QA
on:
  push:
    branches: [feature/sgbuddy-v2.5-travel-essentials]
  pull_request:
    paths:
      - 'app-travel-v250.js'
      - 'app-apps-v240.js'
      - 'app-v120.js'
      - 'app-v090.js'
      - 'data/travel-essentials-v250.json'
      - 'travel-v250.css'
      - 'index.html'
      - 'scripts/browser-qa-v250.mjs'
      - '.github/workflows/check-v250-browser.yml'
permissions:
  contents: read
jobs:
  chromium-travel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve SGBuddy locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/sgbuddy-http.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/sgbuddy-http.log
          exit 1
      - name: Verify V2.5 browser interactions
        run: node scripts/browser-qa-v250.mjs
