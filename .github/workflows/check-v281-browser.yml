name: SGBuddy V2.8.1 Multilingual Navigation QA
on:
  push:
    branches: [fix/sgbuddy-v281-language-navigation]
  pull_request:
    paths:
      - 'app-travel-v250.js'
      - 'app-ux-v160.js'
      - 'lib/i18n-shell-v281.mjs'
      - 'scripts/check-v281.mjs'
      - 'scripts/browser-qa-v281.mjs'
      - '.github/workflows/check-v281-browser.yml'
permissions:
  contents: read
jobs:
  locale-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full SGBuddy regression suite
        run: npm run check
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve SGBuddy locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sgbuddy-locales.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/sgbuddy-locales.log
          exit 1
      - name: Check all languages and Saved navigation
        run: node scripts/browser-qa-v281.mjs
