name: SGBuddy V2 Official Library QA
on:
  push:
    branches: [feature/sgbuddy-v2-library-at-scale]
  pull_request:
    paths:
      - 'data/official-places-v200.json'
      - 'app-v120.js'
      - 'app-v140.js'
      - 'scripts/check-library-v200.mjs'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
