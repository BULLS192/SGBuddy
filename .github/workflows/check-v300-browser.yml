name: SGBuddy V3 — 12-Language Coverage
on:
  push:
    branches: [feature/sgbuddy-v3-comprehensive-i18n]
  pull_request:
    paths:
      - 'app-i18n-v300.js'
      - 'app-device-translate-v300.js'
      - 'lib/i18n-extended-v300.mjs'
      - 'lib/i18n-explainers-v300.mjs'
      - 'scripts/check-v300.mjs'
      - 'scripts/browser-qa-v300.mjs'
      - '.github/workflows/check-v300-browser.yml'
permissions:
  contents: read
jobs:
  multilingual-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full regression suite
        run: npm run check
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local SGBuddy
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sgbuddy-v300.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/sgbuddy-v300.log
          exit 1
      - name: Validate Merli, Food, Facts, Save & translations in all languages
        run: node scripts/browser-qa-v300.mjs
