name: SGBuddy V4.21 Trip Calendar and Events
on:
  pull_request:
    paths:
      - 'app-trip-extras-v421.js'
      - 'trip-extras-v421.css'
      - 'lib/trip-calendar-v421.mjs'
      - 'lib/trip-published-events-v421.mjs'
      - 'scripts/check-v421-calendar.mjs'
      - 'scripts/check-v421-events.mjs'
      - 'scripts/check-v421-integration.mjs'
      - 'scripts/browser-qa-v421-trip.mjs'
      - 'app-v090.js'
      - 'index.html'
      - '.github/workflows/check-v421-trip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check app-trip-extras-v421.js
          node --check lib/trip-calendar-v421.mjs
          node --check lib/trip-published-events-v421.mjs
          node scripts/check-v421-calendar.mjs
          node scripts/check-v421-events.mjs
          node scripts/check-v421-integration.mjs
          node scripts/check-v420-release.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sgbuddy-v421.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/sgbuddy-v421.log; exit 1
      - run: node scripts/browser-qa-v421-trip.mjs
