name: SGBuddy V4.13 Stability & Persona QA
on:
  pull_request:
    paths:
      - 'scripts/check-v413.mjs'
      - 'scripts/browser-qa-v413.mjs'
      - 'scripts/check-v413-air.mjs'
      - 'scripts/browser-qa-v413-air.mjs'
      - 'scripts/browser-qa-v413-outages.mjs'
      - 'scripts/browser-qa-v413-pwa.mjs'
      - 'QA_CHECKLIST.md'
      - 'lib/i18n-air-v413.mjs'
      - 'lib/events-review-v413.mjs'
      - 'scripts/check-event-review-v413.mjs'
      - 'scripts/event-review-summary-v413.mjs'
      - 'app-v120.js'
      - 'scripts/browser-audit-v430.mjs'
      - 'scripts/check-all.mjs'
      - 'docs/stability-v413.md'
      - '.github/workflows/check-v413.yml'
      - 'data/events-v470.json'
      - 'data/events-review-queue-v470.json'
      - 'data/event-approvals-v490.json'
      - 'data/event-feeds-v470.json'
      - 'data/event-venue-sources-v490.json'
      - 'scripts/publish-reviewed-events-v490.mjs'
      - '.github/workflows/events-refresh-v470.yml'
      - 'lib/offline-packs-v480.mjs'
      - 'app-v090.js'
      - 'app-events-v470.js'
      - 'app-offline-v480.js'
      - 'app-i18n-*.js'
      - 'lib/i18n-*.mjs'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-v413.mjs
      - run: node scripts/check-v413-air.mjs
      - run: node scripts/check-release-v4120.mjs
      - run: node scripts/check-v480.mjs
      - run: node scripts/check-events-v470.mjs
      - run: node scripts/check-v430.mjs
      - run: node scripts/check-event-feeds-v480.mjs
      - run: node scripts/check-event-venues-v490.mjs
      - run: node scripts/publish-reviewed-events-v490.mjs
      - run: node scripts/check-event-review-v413.mjs
      - run: node scripts/event-review-summary-v413.mjs --check
      - name: Publish review-only candidate triage summary
        run: node scripts/event-review-summary-v413.mjs --markdown >> "$GITHUB_STEP_SUMMARY"
  persona-browser:
    strategy:
      fail-fast: false
      matrix:
        viewport: [mobile, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve local app
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sgbuddy-v413.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/sgbuddy-v413.log
          exit 1
      - name: Verify five personas with 12 locales
        run: node scripts/browser-qa-v413.mjs --${{ matrix.viewport }}

  persona-rendered-audit:
    strategy:
      fail-fast: false
      matrix:
        persona: [resident, visitor, executive, new_in_sg, student]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve local app
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/sgbuddy-v413-audit.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/sgbuddy-v413-audit.log
          exit 1
      - name: Record rendered first-party language observations
        run: node scripts/browser-audit-v430.mjs --persona=${{ matrix.persona }} --out-dir=artifacts/v413-${{ matrix.persona }}
      - name: Write persona audit summary
        if: always()
        run: |
          if [ -f artifacts/v413-${{ matrix.persona }}/summary.md ]; then
            cat artifacts/v413-${{ matrix.persona }}/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sgbuddy-v413-audit-${{ matrix.persona }}
          path: artifacts/v413-${{ matrix.persona }}/
          if-no-files-found: warn
          retention-days: 7

  air-outage-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve local application
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/sgbuddy-v413-air.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/sgbuddy-v413-air.log
          exit 1
      - name: Validate source-safe Air Quality translation and stale/cached states
        run: node scripts/browser-qa-v413-air.mjs
      - name: Simulate weather/train/traffic outage and recovery
        run: node scripts/browser-qa-v413-outages.mjs

  pwa-disconnected-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve local first-party app
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/sgbuddy-v413-pwa.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/sgbuddy-v413-pwa.log
          exit 1
      - name: Test offline packs, disconnected reload, and interrupted update
        run: node scripts/browser-qa-v413-pwa.mjs
