name: SGBuddy V4.19 RC Full Acceptance
on:
  pull_request:
    paths:
      - 'lib/trip-v260.mjs'
      - 'app-trip-v260.js'
      - 'trip-v260.css'
      - 'data/events-review-queue-v470.json'
      - 'data/events-evidence-v419.json'
      - 'index.html'
      - 'app-v090.js'
      - 'sw.js'
      - 'lib/offline-device-v417.mjs'
      - 'scripts/check-v419-release.mjs'
      - 'scripts/check-v419-trip-wave2.mjs'
      - 'scripts/browser-qa-v419-trip-wave2.mjs'
      - '.github/workflows/check-v419-rc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/check-v419-release.mjs
          node scripts/check-v419-event-evidence.mjs
          node scripts/check-v419-trip.mjs
          node scripts/check-v419-trip-wave2.mjs
          node scripts/check-v418-discovery.mjs
          node scripts/check-v417-release.mjs
          node scripts/check-v416-final.mjs
          node scripts/check-v415-final.mjs
  trip-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sgbuddy-v419.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/sgbuddy-v419.log; exit 1
      - run: |
          node scripts/browser-qa-v419-trip.mjs
          node scripts/browser-qa-v419-trip-wave2.mjs
          node scripts/browser-qa-v418-events.mjs
